name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA already merged into master and green in CI
        required: true
        type: string
      activate_telegram_relay:
        description: Activate the reviewed .env.next Telegram relay settings during this release
        required: false
        default: false
        type: boolean
      activate_messenger_notifications:
        description: Activate the reviewed .env.next Informer settings during this release
        required: false
        default: false
        type: boolean
      activate_email_notifications:
        description: Enable incident email notifications using the existing SMTP configuration only
        required: false
        default: false
        type: boolean
      provision_owner:
        description: Import the reviewed create-only owner payload staged on the backend VPS
        required: false
        default: false
        type: boolean
      activate_admin_mfa:
        description: Add the reviewed MFA encryption key from .env.next without rotating an active key
        required: false
        default: false
        type: boolean
      activate_oauth:
        description: Activate reviewed VK and Yandex OAuth settings from .env.next without rotating existing credentials
        required: false
        default: false
        type: boolean

      activate_yookassa_test:
        description: Activate owner-only YooKassa test shop settings from protected environment secrets
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: heartbeat-checker-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production-backend
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      ACTIVATE_TELEGRAM_RELAY: ${{ inputs.activate_telegram_relay }}
      ACTIVATE_MESSENGER_NOTIFICATIONS: ${{ inputs.activate_messenger_notifications }}
      ACTIVATE_EMAIL_NOTIFICATIONS: ${{ inputs.activate_email_notifications }}
      PROVISION_OWNER: ${{ inputs.provision_owner }}
      ACTIVATE_ADMIN_MFA: ${{ inputs.activate_admin_mfa }}
      ACTIVATE_OAUTH: ${{ inputs.activate_oauth }}
      ACTIVATE_YOOKASSA_TEST: ${{ inputs.activate_yookassa_test }}
      DEPLOY_HOST: ${{ vars.BACKEND_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.BACKEND_DEPLOY_USER }}
    steps:
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]] || { echo 'Dispatch from master'; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Provide a full lowercase commit SHA'; exit 1; }
          [[ "$ACTIVATE_TELEGRAM_RELAY" == true || "$ACTIVATE_TELEGRAM_RELAY" == false ]] || {
            echo 'Invalid Telegram relay activation flag'; exit 1;
          }
          [[ "$ACTIVATE_MESSENGER_NOTIFICATIONS" == true || "$ACTIVATE_MESSENGER_NOTIFICATIONS" == false ]] || {
            echo 'Invalid messenger notification activation flag'; exit 1;
          }
          [[ "$PROVISION_OWNER" == true || "$PROVISION_OWNER" == false ]] || {
            echo 'Invalid owner provisioning flag'; exit 1;
          }
          [[ "$ACTIVATE_ADMIN_MFA" == true || "$ACTIVATE_ADMIN_MFA" == false ]] || {
            echo 'Invalid admin MFA activation flag'; exit 1;
          }
          [[ "$ACTIVATE_OAUTH" == true || "$ACTIVATE_OAUTH" == false ]] || {
            echo 'Invalid OAuth activation flag'; exit 1;
          }
          [[ "$ACTIVATE_YOOKASSA_TEST" == true || "$ACTIVATE_YOOKASSA_TEST" == false ]] || {
            echo 'Invalid YooKassa test activation flag'; exit 1;
          }
          [[ "$ACTIVATE_EMAIL_NOTIFICATIONS" == true || "$ACTIVATE_EMAIL_NOTIFICATIONS" == false ]] || {
            echo 'Invalid email notification activation flag'; exit 1;
          }
          if [[ "$ACTIVATE_EMAIL_NOTIFICATIONS" == true ]]; then
            [[ "$ACTIVATE_TELEGRAM_RELAY" == false && "$ACTIVATE_MESSENGER_NOTIFICATIONS" == false && "$ACTIVATE_ADMIN_MFA" == false && "$ACTIVATE_OAUTH" == false && "$PROVISION_OWNER" == false && "$ACTIVATE_YOOKASSA_TEST" == false ]] || {
              echo 'Email activation must be a separate configuration operation'; exit 1;
            }
          fi
          if [[ "$ACTIVATE_YOOKASSA_TEST" == true ]]; then
            [[ "$ACTIVATE_TELEGRAM_RELAY" == false && "$ACTIVATE_MESSENGER_NOTIFICATIONS" == false && "$ACTIVATE_ADMIN_MFA" == false && "$ACTIVATE_OAUTH" == false && "$PROVISION_OWNER" == false && "$ACTIVATE_EMAIL_NOTIFICATIONS" == false ]] || {
              echo 'YooKassa activation must be a separate configuration operation'; exit 1;
            }
          fi
          [[ "$DEPLOY_HOST" == 176.12.64.115 && "$DEPLOY_USER" == heartbeat-deploy ]] || {
            echo 'Backend host/user do not match the approved VPS'; exit 1;
          }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify master ancestry and exact-SHA CI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git show-ref --verify --quiet refs/remotes/origin/master
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master || { echo 'SHA is not in master'; exit 1; }
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" \
            | jq -e --arg sha "$SOURCE_SHA" \
              '.workflow_runs | any(.[]; .event == "push" and .head_sha == $sha and .conclusion == "success")' >/dev/null \
            || { echo 'No successful push CI run for the exact SHA'; exit 1; }

      - name: Build and publish immutable backend images
        id: images
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for target in api worker probe migrate; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/$target"
            docker build -f backend/Dockerfile --target "$target" \
              --build-arg "VCS_REF=$SOURCE_SHA" -t "$image:$SOURCE_SHA" backend
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:$SOURCE_SHA")" == "$SOURCE_SHA" ]]
            docker push "$image:$SOURCE_SHA"
            digest=$(docker buildx imagetools inspect "$image:$SOURCE_SHA" | awk '$1 == "Digest:" { print $2; exit }')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No digest for $target"; exit 1; }
            echo "$target=$image@$digest" >> "$GITHUB_OUTPUT"
          done
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backup"
          docker build -f deploy/backend/backup/Dockerfile \
            --build-arg "VCS_REF=$SOURCE_SHA" -t "$image:$SOURCE_SHA" deploy/backend/backup
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:$SOURCE_SHA")" == "$SOURCE_SHA" ]]
          docker push "$image:$SOURCE_SHA"
          digest=$(docker buildx imagetools inspect "$image:$SOURCE_SHA" | awk '$1 == "Digest:" { print $2; exit }')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'No digest for backup'; exit 1; }
          echo "backup=$image@$digest" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable firewall helper
        id: firewall
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/firewall"
          docker build -f deploy/backend/firewall/Dockerfile --build-arg "VCS_REF=$SOURCE_SHA" \
            -t "$image:$SOURCE_SHA" deploy/backend
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:$SOURCE_SHA")" == "$SOURCE_SHA" ]]
          docker push "$image:$SOURCE_SHA"
          digest=$(docker buildx imagetools inspect "$image:$SOURCE_SHA" | awk '$1 == "Digest:" { print $2; exit }')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'No firewall image digest'; exit 1; }
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          policy_sha=$(sha256sum deploy/backend/probe-firewall.sh | awk '{print $1}')
          echo "policy_sha=$policy_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify on backend VPS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
          PROBE_IMAGE: ${{ steps.images.outputs.probe }}
          MIGRATE_IMAGE: ${{ steps.images.outputs.migrate }}
          BACKUP_IMAGE: ${{ steps.images.outputs.backup }}
          FIREWALL_IMAGE: ${{ steps.firewall.outputs.image }}
          FIREWALL_POLICY_SHA: ${{ steps.firewall.outputs.policy_sha }}
          YOOKASSA_TEST_SHOP_ID: ${{ secrets.YOOKASSA_TEST_SHOP_ID }}
          YOOKASSA_TEST_SECRET_KEY: ${{ secrets.YOOKASSA_TEST_SECRET_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Missing scoped SSH credentials'; exit 1; }
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_opts=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o BatchMode=yes)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          scp "${ssh_opts[@]}" deploy/backend/compose.yaml "$target:/opt/heartbeat-checker/backend/compose.yaml.incoming"
          scp "${ssh_opts[@]}" deploy/backend/Caddyfile "$target:/opt/heartbeat-checker/backend/Caddyfile.incoming"
          scp "${ssh_opts[@]}" deploy/backend/compose.backup.yaml "$target:/opt/heartbeat-checker/backend/compose.backup.yaml.incoming"
          scp "${ssh_opts[@]}" deploy/backend/backup.sh "$target:/opt/heartbeat-checker/backend/backup.sh.incoming"
          scp "${ssh_opts[@]}" deploy/backend/deploy.sh "$target:/opt/heartbeat-checker/backend/deploy.sh.incoming"
          if [[ "$ACTIVATE_YOOKASSA_TEST" == true ]]; then
            scp "${ssh_opts[@]}" deploy/backend/stage-yookassa.py "$target:/opt/heartbeat-checker/backend/stage-yookassa.py.incoming"
          fi
          if [[ "$PROVISION_OWNER" == true ]]; then
            scp "${ssh_opts[@]}" deploy/backend/import-owner.sql "$target:/opt/heartbeat-checker/backend/import-owner.sql.incoming"
          fi
          python3 - <<'PY' | ssh "${ssh_opts[@]}" "$target" \
            "bash /opt/heartbeat-checker/backend/deploy.sh.incoming '$SOURCE_SHA' '$API_IMAGE' '$WORKER_IMAGE' '$PROBE_IMAGE' '$MIGRATE_IMAGE' '$GITHUB_ACTOR' '$BACKUP_IMAGE' '$ACTIVATE_TELEGRAM_RELAY' '$ACTIVATE_MESSENGER_NOTIFICATIONS' '$PROVISION_OWNER' '$ACTIVATE_ADMIN_MFA' '$ACTIVATE_OAUTH' '$FIREWALL_IMAGE' '$FIREWALL_POLICY_SHA' '$ACTIVATE_YOOKASSA_TEST' '$ACTIVATE_EMAIL_NOTIFICATIONS'"
          import json
          import os
          import re
          import sys
          token = os.environ["GH_TOKEN"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]{1,4096}", token):
              raise SystemExit("Invalid registry credential framing")
          activate = os.environ["ACTIVATE_YOOKASSA_TEST"] == "true"
          payload = None
          if activate:
              shop = os.environ.get("YOOKASSA_TEST_SHOP_ID", "")
              secret = os.environ.get("YOOKASSA_TEST_SECRET_KEY", "")
              if not shop or not secret:
                  raise SystemExit("Missing protected YooKassa test configuration")
              payload = {"shopId": shop, "secretKey": secret}
          sys.stdout.write(token + "\n")
          if payload is not None:
              json.dump(payload, sys.stdout, ensure_ascii=True)
              sys.stdout.write("\n")
          PY

      - name: Verify public backend denies runner traffic
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            https://api.heartbeat-checker.ru/api/v1/me)
          [[ "$status" == 403 ]] || { echo "Unexpected backend edge status: $status"; exit 1; }
