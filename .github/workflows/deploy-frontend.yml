name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA already merged into master and green in CI
        required: true
        type: string
      web_mode:
        description: Full application, frontend without backend, or public landing
        required: true
        default: app
        type: choice
        options:
          - app
          - frontend
          - landing

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: heartbeat-checker-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      WEB_MODE: ${{ inputs.web_mode }}
      WEB_PUBLIC_ORIGIN: ${{ vars.WEB_PUBLIC_ORIGIN }}
      GO_API_ORIGIN: ${{ vars.GO_API_ORIGIN }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      ANDROID_SIGNING_CERTIFICATE_SHA256: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
      DEPLOY_HOST: ${{ vars.FRONTEND_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.FRONTEND_DEPLOY_USER }}
    steps:
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/master' ]] || { echo 'Dispatch this workflow from master'; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Provide a full lowercase commit SHA'; exit 1; }
          [[ "$WEB_MODE" == app || "$WEB_MODE" == frontend || "$WEB_MODE" == landing ]] || { echo 'Invalid web mode'; exit 1; }
          [[ "$WEB_PUBLIC_ORIGIN" == 'https://heartbeat-checker.ru' ]] || { echo 'WEB_PUBLIC_ORIGIN must be the production HTTPS origin'; exit 1; }
          if [[ "$WEB_MODE" == app ]]; then
            [[ "$GO_API_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+(:443)?$ ]] || { echo 'GO_API_ORIGIN must be a public HTTPS origin'; exit 1; }
            normalized_api_origin=${GO_API_ORIGIN,,}
            normalized_api_origin=${normalized_api_origin%:443}
            normalized_api_origin=${normalized_api_origin%.}
            [[ "$normalized_api_origin" != "$WEB_PUBLIC_ORIGIN" && "$normalized_api_origin" != *localhost* && "$normalized_api_origin" != *127.0.0.1* ]] || { echo 'GO_API_ORIGIN must reach the separate public Go API'; exit 1; }
          fi
          if [[ "$WEB_MODE" != landing ]]; then
            [[ "$TURNSTILE_SITE_KEY" =~ ^0x4[A-Za-z0-9_-]{20,}$ ]] || { echo 'A production Turnstile site key is required'; exit 1; }
          fi
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid deploy host or user'; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify master ancestry and exact-SHA CI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git show-ref --verify --quiet refs/remotes/origin/master || { echo 'master tracking ref is unavailable'; exit 1; }
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master || { echo 'SHA is not in master history'; exit 1; }
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" \
            | jq -e --arg sha "$SOURCE_SHA" '.workflow_runs | any(.[]; .event == "push" and .head_sha == $sha and .conclusion == "success")' >/dev/null \
            || { echo 'No successful CI workflow run for the exact SHA'; exit 1; }

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: tools/go.sum
      - name: Build exact-source static operations binary
        shell: bash
        run: |
          set -euo pipefail
          make build-ops OPS_OUTPUT="$RUNNER_TEMP/hc-ops/hc-ops" OPS_SOURCE_SHA="$SOURCE_SHA"
          [[ "$("$RUNNER_TEMP/hc-ops/hc-ops" version)" == "$SOURCE_SHA" ]]
      - name: Retain exact-source operations binary and transport checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hc-ops-frontend-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/hc-ops/hc-ops
            ${{ runner.temp }}/hc-ops/hc-ops.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Validate committed Android release provenance
        shell: bash
        run: |
          set -euo pipefail
          manifest=apps/web/src/shared/android/release.json
          if jq -e '. != null' "$manifest" >/dev/null; then
            "$RUNNER_TEMP/hc-ops/hc-ops" android-release "$manifest" --frontend-sha "$SOURCE_SHA" \
              --fingerprint "$ANDROID_SIGNING_CERTIFICATE_SHA256"
          fi
          digest=$(sha256sum "$manifest" | cut -d' ' -f1)
          echo "ANDROID_MANIFEST_SHA256=$digest" >> "$GITHUB_ENV"
          jq -n --arg frontendSourceSha "$SOURCE_SHA" --arg manifestSha256 "$digest" \
            --slurpfile androidRelease "$manifest" \
            '{frontendSourceSha: $frontendSourceSha, manifestSha256: $manifestSha256, androidRelease: $androidRelease[0]}' > frontend-android-receipt.json

      - name: Build and publish immutable web image
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          image="ghcr.io/${GITHUB_REPOSITORY,,}/web"
          api_origin=$GO_API_ORIGIN
          site_key=$TURNSTILE_SITE_KEY
          if [[ "$WEB_MODE" != app ]]; then
            api_origin=
          fi
          if [[ "$WEB_MODE" == landing ]]; then
            site_key=
          fi
          tag="$SOURCE_SHA-$WEB_MODE"
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f apps/web/Dockerfile \
            --build-arg "VCS_REF=$SOURCE_SHA" \
            --build-arg "ANDROID_MANIFEST_SHA256=$ANDROID_MANIFEST_SHA256" \
            --build-arg "WEB_MODE=$WEB_MODE" \
            --build-arg "GO_API_ORIGIN=$api_origin" \
            --build-arg "WEB_PUBLIC_ORIGIN=$WEB_PUBLIC_ORIGIN" \
            --build-arg "NEXT_PUBLIC_TURNSTILE_SITE_KEY=$site_key" \
            -t "$image:$tag" apps/web
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:$tag")" == "$SOURCE_SHA" ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.heartbeat-checker.web-mode" }}' "$image:$tag")" == "$WEB_MODE" ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.heartbeat-checker.android-manifest-sha256" }}' "$image:$tag")" == "$ANDROID_MANIFEST_SHA256" ]]
          docker push "$image:$tag"
          digest=$(docker buildx imagetools inspect "$image:$tag" | awk '$1 == "Digest:" { print $2; exit }')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Unable to resolve pushed OCI digest'; exit 1; }
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify on frontend VPS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.FRONTEND_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FRONTEND_DEPLOY_KNOWN_HOSTS }}
          WEB_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Missing scoped SSH credentials'; exit 1; }
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_opts=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o BatchMode=yes)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          api_origin=$GO_API_ORIGIN
          if [[ "$WEB_MODE" != app ]]; then api_origin=; fi
          scp "${ssh_opts[@]}" deploy/frontend/compose.yaml "$target:/opt/heartbeat-checker/frontend/compose.yaml.incoming"
          scp "${ssh_opts[@]}" deploy/frontend/Caddyfile "$target:/opt/heartbeat-checker/frontend/Caddyfile.incoming"
          scp "${ssh_opts[@]}" deploy/frontend/deploy.sh "$target:/opt/heartbeat-checker/frontend/deploy.sh.incoming"
          # shellcheck disable=SC2029 # Release arguments are validated and intentionally expand locally.
          printf '%s\n' "$GH_TOKEN" | ssh "${ssh_opts[@]}" "$target" \
            "bash /opt/heartbeat-checker/frontend/deploy.sh.incoming '$SOURCE_SHA' '$WEB_IMAGE' '$api_origin' '$GITHUB_ACTOR' '$WEB_MODE'"

      - name: Retain frontend Android provenance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-android-${{ inputs.source_sha }}
          path: frontend-android-receipt.json
          if-no-files-found: error
          retention-days: 90
