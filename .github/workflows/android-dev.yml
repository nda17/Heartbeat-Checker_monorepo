name: Build or publish Android Dev

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA merged into master with successful exact-SHA CI
        required: true
        type: string
      publish:
        description: Publish a previously accepted dev APK candidate
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: Candidate workflow run ID (required only when publishing)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: heartbeat-checker-android-dev
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-dev-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SIGNING_FINGERPRINT: ${{ vars.ANDROID_DEV_SIGNING_CERTIFICATE_SHA256 }}
    steps:
      - name: Validate dev build inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SIGNING_FINGERPRINT" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]] || { echo 'Configure the separate dev signing certificate fingerprint'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify master ancestry and exact-SHA CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" \
            | jq -e --arg sha "$SOURCE_SHA" '.workflow_runs | any(.[]; .event == "push" and .head_sha == $sha and .conclusion == "success")' >/dev/null
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: tools/go.sum
      - name: Build exact-source operations binary
        shell: bash
        run: |
          set -euo pipefail
          make build-ops OPS_OUTPUT="$RUNNER_TEMP/hc-ops/hc-ops" OPS_SOURCE_SHA="$SOURCE_SHA"
          [[ "$("$RUNNER_TEMP/hc-ops/hc-ops" version)" == "$SOURCE_SHA" ]]
      - name: Retain exact-source operations binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hc-ops-android-dev-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/hc-ops/hc-ops
            ${{ runner.temp }}/hc-ops/hc-ops.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked React Native dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Install explicit Android SDK components
        run: bash deploy/android/setup-sdk.sh
      - name: Build separately signed Metro APK
        shell: bash
        env:
          ANDROID_DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          ANDROID_DEV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          ANDROID_DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          ANDROID_DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_DEV_KEYSTORE_BASE64" && -n "$ANDROID_DEV_KEYSTORE_PASSWORD" && -n "$ANDROID_DEV_KEY_ALIAS" && -n "$ANDROID_DEV_KEY_PASSWORD" ]] || { echo 'Missing dedicated dev signing credentials'; exit 1; }
          export ANDROID_DEV_KEYSTORE_FILE="$RUNNER_TEMP/heartbeat-android-dev.keystore"
          trap 'rm -f "$ANDROID_DEV_KEYSTORE_FILE"' EXIT
          umask 077
          printf '%s' "$ANDROID_DEV_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_DEV_KEYSTORE_FILE"
          unset ANDROID_DEV_KEYSTORE_BASE64
          cd apps/android
          ./gradlew --no-daemon :app:assembleDev
      - name: Verify separate package, signing and unbundled Metro profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-dev
          cp apps/android/app/build/outputs/apk/dev/app-dev.apk android-dev/Heartbeat-Checker-dev.apk
          apk="$PWD/android-dev/Heartbeat-Checker-dev.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/android-dev-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/android-dev-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/android-dev-manifest.txt"
          grep -Fx 'application-debuggable' "$RUNNER_TEMP/android-dev-badging.txt" >/dev/null
          grep -F 'android.permission.ACCESS_LOCAL_NETWORK' "$RUNNER_TEMP/android-dev-manifest.txt" >/dev/null
          if unzip -Z1 "$apk" | grep -Fx 'assets/index.android.bundle'; then echo 'Dev APK must load JS from Metro'; exit 1; fi
          if grep -F 'heartbeat-checker.ru' "$RUNNER_TEMP/android-dev-manifest.txt"; then echo 'Dev APK must not claim production App Links'; exit 1; fi
          "$RUNNER_TEMP/hc-ops/hc-ops" android-dev-manifest --apk "$apk" \
            --signature "$RUNNER_TEMP/android-dev-signature.txt" --badging "$RUNNER_TEMP/android-dev-badging.txt" \
            --source-sha "$SOURCE_SHA" --fingerprint "$SIGNING_FINGERPRINT" --output android-dev/release.json
          jq -e '.packageName == "ru.heartbeatchecker.app.dev" and .versionName == "2.0.2-dev" and .versionCode == 9' android-dev/release.json >/dev/null
      - name: Retain immutable dev candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-dev-build-${{ inputs.source_sha }}
          path: |
            android-dev/Heartbeat-Checker-dev.apk
            android-dev/release.json
          if-no-files-found: error
          retention-days: 90
  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-backend
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SIGNING_FINGERPRINT: ${{ vars.ANDROID_DEV_SIGNING_CERTIFICATE_SHA256 }}
    steps:
      - name: Validate explicit dev promotion inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,17}$ && "$CANDIDATE_RUN_ID" != "$GITHUB_RUN_ID" ]]
          [[ "$SIGNING_FINGERPRINT" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify accepted candidate run and exact-SHA CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            | jq -e --arg repo "$GITHUB_REPOSITORY" \
              '.repository.full_name == $repo and .path == ".github/workflows/android-dev.yml" and .head_branch == "master" and .event == "workflow_dispatch" and .conclusion == "success"' >/dev/null
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" \
            | jq -e --arg sha "$SOURCE_SHA" '.workflow_runs | any(.[]; .event == "push" and .head_sha == $sha and .conclusion == "success")' >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-dev-build-${{ inputs.source_sha }}
          path: android-dev
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hc-ops-android-dev-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/hc-ops
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact-source operations artifact
        shell: bash
        run: |
          set -euo pipefail
          ops_sha=$(cut -d' ' -f1 "$RUNNER_TEMP/hc-ops/hc-ops.sha256")
          [[ $ops_sha =~ ^[0-9a-f]{64}$ && "$(sha256sum "$RUNNER_TEMP/hc-ops/hc-ops" | awk '{print $1}')" == "$ops_sha" ]]
          chmod 700 "$RUNNER_TEMP/hc-ops/hc-ops"
          [[ "$("$RUNNER_TEMP/hc-ops/hc-ops" version)" == "$SOURCE_SHA" ]]
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android verification tools
        run: bash deploy/android/setup-sdk.sh --verify-only
      - name: Recheck downloaded dev APK against original manifest
        shell: bash
        run: |
          set -euo pipefail
          apk=android-dev/Heartbeat-Checker-dev.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/android-dev-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/android-dev-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/android-dev-manifest.txt"
          grep -Fx 'application-debuggable' "$RUNNER_TEMP/android-dev-badging.txt" >/dev/null
          grep -F 'android.permission.ACCESS_LOCAL_NETWORK' "$RUNNER_TEMP/android-dev-manifest.txt" >/dev/null
          if unzip -Z1 "$apk" | grep -Fx 'assets/index.android.bundle'; then echo 'Dev APK must load JS from Metro'; exit 1; fi
          if grep -F 'heartbeat-checker.ru' "$RUNNER_TEMP/android-dev-manifest.txt"; then echo 'Dev APK must not claim production App Links'; exit 1; fi
          "$RUNNER_TEMP/hc-ops/hc-ops" android-dev-manifest --apk "$apk" \
            --signature "$RUNNER_TEMP/android-dev-signature.txt" --badging "$RUNNER_TEMP/android-dev-badging.txt" \
            --source-sha "$SOURCE_SHA" --fingerprint "$SIGNING_FINGERPRINT" --output "$RUNNER_TEMP/dev-rechecked.json"
          jq -e '.packageName == "ru.heartbeatchecker.app.dev" and .versionName == "2.0.2-dev" and .versionCode == 9' android-dev/release.json >/dev/null
          [[ "$(jq -Sc 'del(.builtAt)' android-dev/release.json)" == "$(jq -Sc 'del(.builtAt)' "$RUNNER_TEMP/dev-rechecked.json")" ]]
      - name: Publish exact dev APK through protected backend runner
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.BACKEND_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.BACKEND_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" == 176.12.64.115 && "$DEPLOY_USER" == heartbeat-deploy ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          publish_dir=$(mktemp -d)
          trap 'rm -rf "$publish_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$publish_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$publish_dir/known_hosts"
          ssh_opts=(-i "$publish_dir/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$publish_dir/known_hosts" -o BatchMode=yes)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          stage="/opt/heartbeat-checker/backend/android-dev-private/incoming/$SOURCE_SHA-$GITHUB_RUN_ID"
          ssh "${ssh_opts[@]}" "$target" "umask 077; mkdir -p '$stage'; test ! -L '$stage'"
          ops_sha=$(sha256sum "$RUNNER_TEMP/hc-ops/hc-ops" | awk '{print $1}')
          [[ $ops_sha =~ ^[0-9a-f]{64}$ ]]
          scp "${ssh_opts[@]}" android-dev/Heartbeat-Checker-dev.apk android-dev/release.json \
            deploy/android/publish-dev.sh "$RUNNER_TEMP/hc-ops/hc-ops" "$target:$stage/"
          ssh "${ssh_opts[@]}" "$target" \
            "bash '$stage/publish-dev.sh' '$SOURCE_SHA' '$SIGNING_FINGERPRINT' '$GITHUB_RUN_ID' '$ops_sha'" \
            > android-dev/publication-receipt.json
          jq -e --arg sha "$SOURCE_SHA" --arg apk "$(sha256sum android-dev/Heartbeat-Checker-dev.apk | awk '{print $1}')" \
            '.sourceSha == $sha and .sha256 == $apk and (.sizeBytes | type == "number") and (.versionName | type == "string")' \
            android-dev/publication-receipt.json >/dev/null
      - name: Retain verified dev publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-dev-published-${{ inputs.source_sha }}
          path: |
            android-dev/release.json
            android-dev/publication-receipt.json
          if-no-files-found: error
          retention-days: 90
