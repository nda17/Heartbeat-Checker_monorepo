name: CI

on:
  push:
    branches:
      - master
      - 'dev_*/**'
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: heartbeat_local
          POSTGRES_USER: heartbeat_local
          POSTGRES_PASSWORD: heartbeat_local_only
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U heartbeat_local -d heartbeat_local"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: ghcr.io/axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - '127.0.0.1:51025:1025'
          - '127.0.0.1:58025:8025'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: backend/go.sum
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: PostgreSQL integration and race tests
        env:
          HEARTBEAT_TEST_DATABASE_URL: postgres://heartbeat_local:heartbeat_local_only@127.0.0.1:55432/heartbeat_local?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Local SMTP auth smoke
        env:
          HEARTBEAT_LIVE_AUTH: 'true'
          HEARTBEAT_TEST_DATABASE_URL: postgres://heartbeat_local:heartbeat_local_only@127.0.0.1:55432/heartbeat_local?sslmode=disable
        run: |
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:58025/api/v1/info
          go test -count=1 ./internal/modules/auth -run '^TestLocalSMTPAuthSmoke$'
      - name: Build backend commands
        run: go build ./cmd/api ./cmd/worker ./cmd/probe ./cmd/migrate ./cmd/local-grant ./cmd/local-admin

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install explicit Android SDK components
        run: bash deploy/android/setup-sdk.sh
      - name: Android lint, tests and debug build without release credentials
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:lint :app:testDebugUnitTest :app:assembleDebug
      - name: Validate Android delivery scripts
        run: |
          shellcheck deploy/android/publish.sh deploy/android/setup-sdk.sh
          bash -n deploy/android/publish.sh deploy/android/setup-sdk.sh
          python3 -m py_compile deploy/android/release.py deploy/android/publish.py
          python3 -m unittest discover -s deploy/android -p 'test_*.py'

  android-emulator:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and API 35 emulator image
        run: bash deploy/android/setup-sdk.sh 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Prepare accelerated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libpulse0
          [[ -c /dev/kvm ]] || { echo 'Hosted runner requires KVM for Android smoke'; exit 1; }
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          printf 'no\n' | avdmanager create avd --force --name heartbeat-ci --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
      - name: Run native instrumentation smoke on Android API 35
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          adb_bin="$ANDROID_HOME/platform-tools/adb"
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          report_dir=app/build/reports/emulator
          mkdir -p "$report_dir"
          emulator_log="$report_dir/emulator.log"
          emulator_pid=
          exec 3>&2 # Keep EXIT diagnostics outside the preflight log redirects.
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            timeout 5 "$adb_bin" devices -l > "$report_dir/adb-devices.txt" 2>&1
            timeout 10 "$adb_bin" -s emulator-5554 logcat -d -t 200 > "$report_dir/logcat.txt" 2>&1
            tail -150 "$emulator_log" >&3 2>&3
            timeout 10 "$adb_bin" -s emulator-5554 emu kill > /dev/null 2>&1
            if [[ -n "$emulator_pid" ]]; then kill "$emulator_pid" 2>/dev/null; fi
            exit "$status"
          }
          trap cleanup EXIT
          {
            avdmanager list avd
            LD_LIBRARY_PATH="$ANDROID_HOME/emulator/lib64:$ANDROID_HOME/emulator/lib64/qt/lib:$ANDROID_HOME/emulator/lib64/vulkan:$ANDROID_HOME/emulator/lib64/gles_swiftshader${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" | tee "$report_dir/native-libraries.txt"
            if grep -F 'not found' "$report_dir/native-libraries.txt"; then
              echo 'Android emulator has missing native runtime libraries'
              exit 1
            fi
            "$emulator_bin" -version
            "$emulator_bin" -accel-check
            "$emulator_bin" -list-avds | tee "$report_dir/available-avds.txt"
            grep -Fx 'heartbeat-ci' "$report_dir/available-avds.txt"
          } > "$emulator_log" 2>&1
          "$emulator_bin" -avd heartbeat-ci -port 5554 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none \
            >> "$emulator_log" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 240))
          while true; do
            kill -0 "$emulator_pid" || { echo 'Android emulator exited before boot completed'; exit 1; }
            if [[ $(timeout 5 "$adb_bin" -s emulator-5554 get-state 2>/dev/null || true) == device &&
                  $(timeout 5 "$adb_bin" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo 'Android emulator boot timed out'
              exit 1
            fi
            sleep 2
          done
          "$adb_bin" -s emulator-5554 shell settings put global window_animation_scale 0
          "$adb_bin" -s emulator-5554 shell settings put global transition_animation_scale 0
          "$adb_bin" -s emulator-5554 shell settings put global animator_duration_scale 0
          "$adb_bin" -s emulator-5554 shell input keyevent 82
          "$adb_bin" -s emulator-5554 shell svc wifi disable
          "$adb_bin" -s emulator-5554 shell svc data disable
          test -n "$(find app/src/androidTest -type f -name '*.java' -print -quit)"
          echo 'Emulator boot complete; running native instrumentation tests'
          ANDROID_SERIAL=emulator-5554 ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Retain instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-${{ github.sha }}
          path: |
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/reports/emulator/
          if-no-files-found: warn
          retention-days: 30

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate committed Android release metadata
        working-directory: .
        env:
          SIGNING_FINGERPRINT: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          manifest=apps/web/src/shared/android/release.json
          if jq -e '. != null' "$manifest" >/dev/null; then
            python3 deploy/android/release.py "$manifest" --frontend-sha "$GITHUB_SHA" --fingerprint "$SIGNING_FINGERPRINT"
          fi
      - run: npm ci
      - name: Admin and session component regressions
        run: npm run test:ui
      - run: npm run lint
      - run: npm run typecheck
      - name: Build web
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          WEB_PUBLIC_ORIGIN: http://127.0.0.1:3000
          GO_API_ORIGIN: http://127.0.0.1:8080
        run: npm run build
      - name: Smoke rendered SEO metadata and crawl boundaries
        env:
          WEB_MODE: app
          WEB_PUBLIC_ORIGIN: http://127.0.0.1:3000
          GO_API_ORIGIN: http://127.0.0.1:8080
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          PORT: '3139'
        run: |
          set -euo pipefail
          node scripts/start.mjs > "$RUNNER_TEMP/seo-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 45))
          until curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:3139/; do
            if (( SECONDS >= deadline )); then
              cat "$RUNNER_TEMP/seo-server.log"
              exit 1
            fi
            sleep 1
          done
          python3 scripts/seo-smoke.py --base-url http://127.0.0.1:3139
      - name: Build public landing without backend
        env:
          WEB_MODE: landing
          WEB_PUBLIC_ORIGIN: https://heartbeat-checker.ru
          GO_API_ORIGIN: ''
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ''
        run: npm run build
      - name: Build frontend without backend
        env:
          WEB_MODE: frontend
          WEB_PUBLIC_ORIGIN: https://heartbeat-checker.ru
          GO_API_ORIGIN: ''
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAABBBBBCCCCCDDDDD'
        run: npm run build

  frontend-deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate frontend deployment files
        run: |
          set -euo pipefail
          shellcheck deploy/frontend/bootstrap.sh deploy/frontend/deploy.sh
          bash -n deploy/frontend/bootstrap.sh deploy/frontend/deploy.sh
          export WEB_IMAGE=ghcr.io/example/example/web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          docker compose --env-file /dev/null -f deploy/frontend/compose.yaml config -q
          caddy_image=$(docker compose --env-file /dev/null -f deploy/frontend/compose.yaml config --format json | jq -er '.services.caddy.image')
          [[ "$caddy_image" =~ @sha256:[0-9a-f]{64}$ ]]
          docker run --rm -i --network none \
            "$caddy_image" caddy validate --config /dev/stdin --adapter caddyfile < deploy/frontend/Caddyfile
          python3 deploy/frontend/test_deploy.py

  relay-deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate relay deployment files
        run: |
          set -euo pipefail
          shellcheck deploy/relay/deploy.sh
          bash -n deploy/relay/deploy.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          cert_dir=/etc/letsencrypt/live/messengers-proxy.heartbeat-checker.ru
          sudo install -d -m 755 "$cert_dir"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj /CN=messengers-proxy.heartbeat-checker.ru \
            -keyout /tmp/relay-ci-key.pem -out /tmp/relay-ci-cert.pem >/dev/null 2>&1
          sudo install -m 600 /tmp/relay-ci-key.pem "$cert_dir/privkey.pem"
          sudo install -m 644 /tmp/relay-ci-cert.pem "$cert_dir/fullchain.pem"
          sudo install -m 644 deploy/relay/nginx-http.conf /etc/nginx/sites-available/heartbeat-relay-http.conf
          sudo install -m 644 deploy/relay/nginx-https.conf /etc/nginx/sites-available/heartbeat-relay-https.conf
          sudo ln -s /etc/nginx/sites-available/heartbeat-relay-http.conf /etc/nginx/sites-enabled/heartbeat-relay-http.conf
          sudo ln -s /etc/nginx/sites-available/heartbeat-relay-https.conf /etc/nginx/sites-enabled/heartbeat-relay-https.conf
          sudo nginx -t

  backend-deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate backend deployment files
        run: |
          set -euo pipefail
          shellcheck deploy/backend/bootstrap.sh deploy/backend/probe-firewall.sh deploy/backend/firewall/install.sh deploy/backend/deploy.sh deploy/backend/backup.sh
          bash -n deploy/backend/bootstrap.sh deploy/backend/probe-firewall.sh deploy/backend/firewall/install.sh deploy/backend/deploy.sh deploy/backend/backup.sh
          export POSTGRES_PASSWORD=dummy DATABASE_URL='postgres://heartbeat:dummy@postgres:5432/heartbeat?sslmode=disable'
          export TURNSTILE_SECRET_KEY=dummy WEBHOOK_ENCRYPTION_KEY=dummy AUTH_MAIL_ENCRYPTION_KEY=dummy
          export PROBE_SHARED_SECRET=dummy SMTP_ADDR=smtp.example:465 SMTP_FROM=no-reply@example.com
          export SMTP_USERNAME=dummy SMTP_PASSWORD=dummy SMTP_TLS_MODE=implicit_tls
          for target in API WORKER PROBE MIGRATE; do
            export "${target}_IMAGE=ghcr.io/example/heartbeat-checker/${target,,}@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          done
          docker compose --env-file /dev/null -f deploy/backend/compose.yaml config -q
          caddy_image=$(docker compose --env-file /dev/null -f deploy/backend/compose.yaml config --format json | jq -er '.services.caddy.image')
          [[ "$caddy_image" =~ @sha256:[0-9a-f]{64}$ ]]
          docker run --rm -i --network none "$caddy_image" caddy validate --config /dev/stdin --adapter caddyfile < deploy/backend/Caddyfile
          python3 deploy/backend/test_deploy.py
          export BACKUP_IMAGE=ghcr.io/example/heartbeat-checker/backup@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export SOURCE_SHA=$GITHUB_SHA SUPPORT_ENCRYPTION_KEY=dummy
          export BACKUP_S3_ENDPOINT=https://s3.twcstorage.ru BACKUP_S3_BUCKET=heartbeat-data-1 BACKUP_S3_REGION=ru-1
          export BACKUP_S3_ACCESS_KEY_ID=dummy BACKUP_S3_SECRET_ACCESS_KEY=dummy BACKUP_AGE_RECIPIENT=dummy
          export TELEGRAM_BOT_INFORMER_TOKEN=dummy TELEGRAM_INTERNAL_CHAT_ID=-1004317880847 TELEGRAM_BACKUPS_TOPIC_ID=4
          docker compose --env-file /dev/null -f deploy/backend/compose.backup.yaml config -q
          python3 deploy/backend/backup/test_backup.py

  images:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build backend images
        run: |
          for target in api worker probe migrate; do
            docker build -f backend/Dockerfile --target "$target" \
              --build-arg VCS_REF="$GITHUB_SHA" \
              -t "heartbeat-checker/$target:ci" backend
          done
      - name: Verify unprivileged Linux ICMP sockets
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile --target probe-test \
            --build-arg VCS_REF="$GITHUB_SHA" -t heartbeat-checker/probe-test:ci backend
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 65532:65532 \
            --sysctl 'net.ipv4.ping_group_range=65532 65532' \
            -e HEARTBEAT_ICMP_SMOKE=yes heartbeat-checker/probe-test:ci \
            -test.v -test.run '^TestICMPUnprivilegedSmoke$'
      - name: Build backup image
        run: |
          docker build -f deploy/backend/backup/Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" -t heartbeat-checker/backup:ci deploy/backend/backup
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' heartbeat-checker/backup:ci)" == "$GITHUB_SHA" ]]
      - name: Build firewall helper image
        run: |
          docker build -f deploy/backend/firewall/Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" -t heartbeat-checker/firewall:ci deploy/backend
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' heartbeat-checker/firewall:ci)" == "$GITHUB_SHA" ]]
      - name: Verify firewall policy lifecycle in an isolated Linux namespace
        env:
          FIREWALL_TEST_IMAGE: heartbeat-checker/firewall:ci
        run: python3 deploy/backend/firewall/test_firewall.py
      - name: Relay rollback and cleanup regression
        env:
          HEARTBEAT_RELAY_TEST_IMAGE: heartbeat-checker/backup:ci
        run: |
          set -euo pipefail
          docker image inspect "$HEARTBEAT_RELAY_TEST_IMAGE" >/dev/null
          python3 -m unittest discover -s deploy/relay -p test_deploy.py
      - name: Build standalone web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg WEB_MODE=app \
            --build-arg GO_API_ORIGIN=http://api:8080 \
            --build-arg WEB_PUBLIC_ORIGIN=http://127.0.0.1:3000 \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            -t heartbeat-checker/web:ci-app apps/web
          docker build -f apps/web/Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg WEB_MODE=landing \
            --build-arg GO_API_ORIGIN= \
            --build-arg WEB_PUBLIC_ORIGIN=https://heartbeat-checker.ru \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY= \
            -t heartbeat-checker/web:ci-landing apps/web
          docker build -f apps/web/Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg WEB_MODE=frontend \
            --build-arg GO_API_ORIGIN= \
            --build-arg WEB_PUBLIC_ORIGIN=https://heartbeat-checker.ru \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAABBBBBCCCCCDDDDD \
            -t heartbeat-checker/web:ci-frontend apps/web
          for mode in app frontend landing; do
            image="heartbeat-checker/web:ci-$mode"
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" == "$GITHUB_SHA" ]]
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.heartbeat-checker.web-mode" }}' "$image")" == "$mode" ]]
          done
      - name: Cold-start frontend without external network or S3 DNS
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --rm -d --network none heartbeat-checker/web:ci-app)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          expected_url=$(jq -r '.downloadUrl // ""' apps/web/src/shared/android/release.json)
          docker exec -i -e "EXPECTED_APK_URL=$expected_url" "$container" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:3000';
          let ready = false;
          for (let attempt = 0; attempt < 45; attempt++) {
            try { ready = (await fetch(base)).status === 200; } catch {}
            if (ready) break;
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          assert.ok(ready, 'Frontend must cold-start with no external network');
          for (const path of ['/android', '/manifest.webmanifest', '/.well-known/assetlinks.json', '/terms']) {
            assert.equal((await fetch(base + path)).status, 200, path);
          }
          const legacy = await fetch(base + '/downloads/android', {redirect: 'manual'});
          assert.equal(legacy.status, 307);
          assert.equal(legacy.headers.get('location'), '/apps/android/download');
          assert.equal(legacy.headers.get('cache-control'), 'no-store');
          for (const method of ['GET', 'HEAD']) {
            const download = await fetch(base + '/apps/android/download', {method, redirect: 'manual'});
            assert.ok(process.env.EXPECTED_APK_URL ? [502, 504].includes(download.status) : download.status === 404);
            assert.equal(download.headers.get('location'), null);
            assert.equal(download.headers.get('cache-control'), 'no-store');
          }
          JS
          docker network disconnect none "$container"
          docker network connect bridge "$container"
          docker exec "$container" node --input-type=module -e 'const response=await fetch("http://127.0.0.1:3000/android"); if(response.status!==200)process.exit(1)'

      - name: Smoke public landing routes from built image
        run: |
          set -euo pipefail
          container=$(docker run --rm -d -p 127.0.0.1::3000 heartbeat-checker/web:ci-landing)
          smoke_dir=$(mktemp -d)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$smoke_dir"' EXIT
          host_port=$(docker port "$container" 3000/tcp | awk -F: '{print $NF}')
          [[ "$host_port" =~ ^[0-9]+$ ]]
          base="http://127.0.0.1:$host_port"
          deadline=$((SECONDS + 45))
          until curl -fsS --max-time 5 -o /dev/null "$base/" >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Landing did not become ready within 45 seconds' >&2
              docker logs "$container" >&2 || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 --max-time 5 -o "$smoke_dir/home" "$base/"
          grep -Fq 'data-web-mode="landing"' "$smoke_dir/home"
          if grep -Eiq 'href="/(register|login|app)(["/?#])' "$smoke_dir/home"; then exit 1; fi
          for route in terms privacy cookies contacts; do
            grep -Fq "href=\"/$route\"" "$smoke_dir/home"
            status=$(curl -sS --max-time 5 -o "$smoke_dir/$route" -w '%{http_code}' "$base/$route")
            [[ "$status" == 200 && -s "$smoke_dir/$route" ]]
          done
          status=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "$base/api/v1/me")
          [[ "$status" == 404 ]]
          for route in register login forgot-password reset-password verify-email app app/settings; do
            status=$(curl -sS --max-time 5 -D "$smoke_dir/headers" -o /dev/null -w '%{http_code}' "$base/$route")
            [[ "$status" == 307 ]]
            grep -Eiq '^location:[[:space:]]*/[[:space:]]*$' "$smoke_dir/headers"
          done
      - name: Smoke frontend without backend from built image
        run: |
          set -euo pipefail
          container=$(docker run --rm -d -p 127.0.0.1::3000 heartbeat-checker/web:ci-frontend)
          smoke_dir=$(mktemp -d)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$smoke_dir"' EXIT
          host_port=$(docker port "$container" 3000/tcp | awk -F: '{print $NF}')
          [[ "$host_port" =~ ^[0-9]+$ ]]
          base="http://127.0.0.1:$host_port"
          deadline=$((SECONDS + 45))
          until curl -fsS --max-time 5 -o /dev/null "$base/" >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Frontend did not become ready within 45 seconds' >&2
              docker logs "$container" >&2 || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS --max-time 5 -o "$smoke_dir/home" "$base/"
          grep -Fq 'data-web-mode="frontend"' "$smoke_dir/home"
          for route in login register; do
            grep -Fq "href=\"/$route\"" "$smoke_dir/home"
          done
          for route in terms privacy cookies contacts login register forgot-password reset-password verify-email app app/settings; do
            response_file="$smoke_dir/${route//\//-}"
            status=$(curl -sS --max-time 5 -o "$response_file" -w '%{http_code}' "$base/$route")
            [[ "$status" == 200 && -s "$response_file" ]]
          done
          for route in login register; do
            grep -Fq '<form' "$smoke_dir/$route"
            grep -Fq 'name="email"' "$smoke_dir/$route"
            grep -Fq 'name="password"' "$smoke_dir/$route"
          done
          for request in 'GET me' 'POST auth/login' 'POST auth/register'; do
            read -r method route <<< "$request"
            request_args=(-X "$method")
            if [[ "$method" == POST ]]; then request_args+=(-H 'Content-Type: application/json' --data '{}'); fi
            status=$(curl -sS --max-time 5 "${request_args[@]}" -D "$smoke_dir/headers" -o "$smoke_dir/api" -w '%{http_code}' "$base/api/v1/$route")
            [[ "$status" == 503 ]]
            grep -Eq '"error"[[:space:]]*:[[:space:]]*"temporarily_unavailable"' "$smoke_dir/api"
            grep -Eiq '^cache-control:[[:space:]]*no-store' "$smoke_dir/headers"
            if grep -Eiq '^set-cookie:' "$smoke_dir/headers"; then exit 1; fi
          done
