name: CI

on:
  push:
    branches:
      - master
      - 'dev_*/**'
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: heartbeat_local
          POSTGRES_USER: heartbeat_local
          POSTGRES_PASSWORD: heartbeat_local_only
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U heartbeat_local -d heartbeat_local"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: ghcr.io/axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - '127.0.0.1:51025:1025'
          - '127.0.0.1:58025:8025'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: backend/go.sum
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: PostgreSQL integration and race tests
        env:
          HEARTBEAT_TEST_DATABASE_URL: postgres://heartbeat_local:heartbeat_local_only@127.0.0.1:55432/heartbeat_local?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Local SMTP auth smoke
        env:
          HEARTBEAT_LIVE_AUTH: 'true'
          HEARTBEAT_TEST_DATABASE_URL: postgres://heartbeat_local:heartbeat_local_only@127.0.0.1:55432/heartbeat_local?sslmode=disable
        run: |
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:58025/api/v1/info
          go test -count=1 ./internal/modules/auth -run '^TestLocalSMTPAuthSmoke$'
      - name: Build backend commands
        run: go build ./cmd/api ./cmd/worker ./cmd/probe ./cmd/migrate ./cmd/local-grant ./cmd/local-admin

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build web
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          WEB_PUBLIC_ORIGIN: http://127.0.0.1:3000
          GO_API_ORIGIN: http://127.0.0.1:8080
        run: npm run build
      - name: Build public landing without backend
        env:
          WEB_MODE: landing
          WEB_PUBLIC_ORIGIN: https://heartbeat-checker.ru
          GO_API_ORIGIN: ''
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ''
        run: npm run build

  frontend-deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate frontend deployment files
        run: |
          set -euo pipefail
          shellcheck deploy/frontend/bootstrap.sh deploy/frontend/deploy.sh
          bash -n deploy/frontend/bootstrap.sh deploy/frontend/deploy.sh
          export WEB_IMAGE=ghcr.io/example/example/web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          docker compose --env-file /dev/null -f deploy/frontend/compose.yaml config -q
          caddy_image=$(docker compose --env-file /dev/null -f deploy/frontend/compose.yaml config --format json | jq -er '.services.caddy.image')
          [[ "$caddy_image" =~ @sha256:[0-9a-f]{64}$ ]]
          docker run --rm -i --network none \
            "$caddy_image" caddy validate --config /dev/stdin --adapter caddyfile < deploy/frontend/Caddyfile
          python3 deploy/frontend/test_deploy.py

  images:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build backend images
        run: |
          for target in api worker probe migrate; do
            docker build -f backend/Dockerfile --target "$target" \
              --build-arg VCS_REF="$GITHUB_SHA" \
              -t "heartbeat-checker/$target:ci" backend
          done
      - name: Build standalone web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg WEB_MODE=app \
            --build-arg GO_API_ORIGIN=http://api:8080 \
            --build-arg WEB_PUBLIC_ORIGIN=http://127.0.0.1:3000 \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            -t heartbeat-checker/web:ci-app apps/web
          docker build -f apps/web/Dockerfile \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg WEB_MODE=landing \
            --build-arg GO_API_ORIGIN= \
            --build-arg WEB_PUBLIC_ORIGIN=https://heartbeat-checker.ru \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY= \
            -t heartbeat-checker/web:ci-landing apps/web
          for mode in app landing; do
            image="heartbeat-checker/web:ci-$mode"
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" == "$GITHUB_SHA" ]]
            [[ "$(docker image inspect --format '{{ index .Config.Labels "org.heartbeat-checker.web-mode" }}' "$image")" == "$mode" ]]
          done
      - name: Smoke public landing routes from built image
        run: |
          set -euo pipefail
          container=$(docker run --rm -d -p 127.0.0.1::3000 heartbeat-checker/web:ci-landing)
          smoke_dir=$(mktemp -d)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$smoke_dir"' EXIT
          host_port=$(docker port "$container" 3000/tcp | awk -F: '{print $NF}')
          [[ "$host_port" =~ ^[0-9]+$ ]]
          base="http://127.0.0.1:$host_port"
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 --max-time 5 -o "$smoke_dir/home" "$base/"
          grep -Fq 'data-web-mode="landing"' "$smoke_dir/home"
          grep -Fq 'Сервис готовится к запуску' "$smoke_dir/home"
          if grep -Eiq 'href="/(register|login|app)(["/?#])' "$smoke_dir/home"; then exit 1; fi
          for route in terms privacy cookies contacts; do
            grep -Fq "href=\"/$route\"" "$smoke_dir/home"
            status=$(curl -sS --max-time 5 -o "$smoke_dir/$route" -w '%{http_code}' "$base/$route")
            [[ "$status" == 200 && -s "$smoke_dir/$route" ]]
          done
          status=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "$base/api/v1/me")
          [[ "$status" == 404 ]]
          for route in register login forgot-password reset-password verify-email app app/settings; do
            status=$(curl -sS --max-time 5 -D "$smoke_dir/headers" -o /dev/null -w '%{http_code}' "$base/$route")
            [[ "$status" == 307 ]]
            grep -Eiq '^location:[[:space:]]*/[[:space:]]*$' "$smoke_dir/headers"
          done
