name: Build or publish Android

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA merged into master with successful exact-SHA CI
        required: true
        type: string
      publish:
        description: Publish a previously accepted signed candidate
        required: true
        default: false
        type: boolean
      enable_huawei:
        description: Include the reviewed Huawei public app configuration in this candidate or promotion
        required: false
        default: false
        type: boolean
      candidate_run_id:
        description: Candidate workflow run ID (required only when publishing)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: heartbeat-checker-android-production
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SIGNING_FINGERPRINT: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
      RUSTORE_PUSH_PROJECT_ID: ${{ vars.RUSTORE_PUSH_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
      HUAWEI_PUSH_ENABLED: ${{ inputs.enable_huawei }}
      HUAWEI_APP_ID: ${{ inputs.enable_huawei && vars.HUAWEI_APP_ID || '' }}
      HUAWEI_PROJECT_ID: ${{ inputs.enable_huawei && vars.HUAWEI_PROJECT_ID || '' }}
      HUAWEI_CP_ID: ${{ inputs.enable_huawei && vars.HUAWEI_CP_ID || '' }}
      YOOKASSA_SDK_CLIENT_KEY: ${{ vars.YOOKASSA_SDK_CLIENT_KEY }}
      YOOKASSA_SHOP_ID: ${{ vars.YOOKASSA_SHOP_ID }}
      YOOKASSA_SDK_ENVIRONMENT: ${{ vars.YOOKASSA_SDK_ENVIRONMENT }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SIGNING_FINGERPRINT" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]] || { echo 'Configure the permanent public release certificate fingerprint'; exit 1; }
          [[ "$RUSTORE_PUSH_PROJECT_ID" =~ ^[a-zA-Z0-9_-]{8,128}$ ]] || { echo 'Configure the public RuStore Push project ID'; exit 1; }
          [[ "$HUAWEI_PUSH_ENABLED" == true || "$HUAWEI_PUSH_ENABLED" == false ]] || { echo 'Invalid Huawei build mode'; exit 1; }
          if [[ "$HUAWEI_PUSH_ENABLED" == true ]]; then
            for name in HUAWEI_APP_ID HUAWEI_PROJECT_ID HUAWEI_CP_ID; do
              [[ "${!name}" =~ ^[0-9]{1,32}$ ]] || { echo 'Configure complete public Huawei app identity'; exit 1; }
            done
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify master ancestry and exact-SHA CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" \
            | jq -e --arg sha "$SOURCE_SHA" '.workflow_runs | any(.[]; .event == "push" and .head_sha == $sha and .conclusion == "success")' >/dev/null
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: tools/go.sum
      - name: Build exact-source static operations binary
        shell: bash
        run: |
          set -euo pipefail
          make build-ops OPS_OUTPUT="$RUNNER_TEMP/hc-ops/hc-ops" OPS_SOURCE_SHA="$SOURCE_SHA"
          [[ "$("$RUNNER_TEMP/hc-ops/hc-ops" version)" == "$SOURCE_SHA" ]]
      - name: Retain exact-source operations binary and transport checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hc-ops-android-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/hc-ops/hc-ops
            ${{ runner.temp }}/hc-ops/hc-ops.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked React Native dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Install explicit Android SDK components
        run: bash deploy/android/setup-sdk.sh
      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]] || { echo 'Missing dedicated signing credentials'; exit 1; }
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/heartbeat-android-release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          unset ANDROID_KEYSTORE_BASE64
          cd apps/android
          ./gradlew --no-daemon :app:assembleRelease
      - name: Verify package, signing certificate and release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-release
          cp apps/android/app/build/outputs/apk/release/app-release.apk android-release/Heartbeat-Checker.apk
          apk="$PWD/android-release/Heartbeat-Checker.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/android-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/android-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/android-manifest.txt"
          "$RUNNER_TEMP/hc-ops/hc-ops" android-huawei --manifest "$RUNNER_TEMP/android-manifest.txt" --apk "$apk" \
            --enabled "$HUAWEI_PUSH_ENABLED" --app-id "$HUAWEI_APP_ID" --project-id "$HUAWEI_PROJECT_ID" --cp-id "$HUAWEI_CP_ID" \
            --output android-release/huawei-config.json
          "$RUNNER_TEMP/hc-ops/hc-ops" android-manifest --apk "$apk" \
            --signature "$RUNNER_TEMP/android-signature.txt" --badging "$RUNNER_TEMP/android-badging.txt" \
            --source-sha "$SOURCE_SHA" --fingerprint "$SIGNING_FINGERPRINT" \
            --version-name 2.3.0 --version-code 12 --output android-release/release.json
          "$RUNNER_TEMP/hc-ops/hc-ops" android-release android-release/release.json --source-sha "$SOURCE_SHA" --fingerprint "$SIGNING_FINGERPRINT" --apk "$apk"
      - name: Retain immutable signed build before publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-${{ inputs.source_sha }}
          path: |
            android-release/Heartbeat-Checker.apk
            android-release/release.json
            android-release/huawei-config.json
          if-no-files-found: error
          retention-days: 90
  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-backend
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SIGNING_FINGERPRINT: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
      SIGNING_RECOVERY_SHA256: ${{ vars.ANDROID_SIGNING_RECOVERY_SHA256 }}
      HUAWEI_PUSH_ENABLED: ${{ inputs.enable_huawei }}
      HUAWEI_APP_ID: ${{ inputs.enable_huawei && vars.HUAWEI_APP_ID || '' }}
      HUAWEI_PROJECT_ID: ${{ inputs.enable_huawei && vars.HUAWEI_PROJECT_ID || '' }}
      HUAWEI_CP_ID: ${{ inputs.enable_huawei && vars.HUAWEI_CP_ID || '' }}
    steps:
      - name: Validate explicit promotion inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,17}$ && "$CANDIDATE_RUN_ID" != "$GITHUB_RUN_ID" ]]
          [[ "$SIGNING_FINGERPRINT" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify accepted candidate run and exact-SHA CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            | jq -e --arg repo "$GITHUB_REPOSITORY" '.repository.full_name == $repo and .path == ".github/workflows/android-release.yml" and .head_branch == "master" and .event == "workflow_dispatch" and .conclusion == "success"' >/dev/null
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=completed&per_page=100" \
            | jq -e --arg sha "$SOURCE_SHA" '.workflow_runs | any(.[]; .event == "push" and .head_sha == $sha and .conclusion == "success")' >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-build-${{ inputs.source_sha }}
          path: android-release
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hc-ops-android-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/hc-ops
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact-source operations artifact
        shell: bash
        run: |
          set -euo pipefail
          ops_sha=$(cut -d' ' -f1 "$RUNNER_TEMP/hc-ops/hc-ops.sha256")
          [[ $ops_sha =~ ^[0-9a-f]{64}$ && "$(sha256sum "$RUNNER_TEMP/hc-ops/hc-ops" | awk '{print $1}')" == "$ops_sha" ]]
          chmod 700 "$RUNNER_TEMP/hc-ops/hc-ops"
          [[ "$("$RUNNER_TEMP/hc-ops/hc-ops" version)" == "$SOURCE_SHA" ]]
      - name: Recheck immutable signed artifact
        run: |
          "$RUNNER_TEMP/hc-ops/hc-ops" android-release android-release/release.json --source-sha "$SOURCE_SHA" --fingerprint "$SIGNING_FINGERPRINT" --apk android-release/Heartbeat-Checker.apk
          "$RUNNER_TEMP/hc-ops/hc-ops" android-huawei --receipt android-release/huawei-config.json --apk android-release/Heartbeat-Checker.apk \
            --enabled "$HUAWEI_PUSH_ENABLED" --app-id "$HUAWEI_APP_ID" --project-id "$HUAWEI_PROJECT_ID" --cp-id "$HUAWEI_CP_ID"
      - name: Publish exact APK through protected backup runner
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.BACKEND_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.BACKEND_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_KNOWN_HOSTS }}
          ANDROID_SIGNING_RECOVERY_BASE64: ${{ secrets.ANDROID_SIGNING_RECOVERY_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" == 176.12.64.115 && "$DEPLOY_USER" == heartbeat-deploy ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          [[ -n "$ANDROID_SIGNING_RECOVERY_BASE64" && "$SIGNING_RECOVERY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          publish_dir=$(mktemp -d)
          trap 'rm -rf "$publish_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$publish_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$publish_dir/known_hosts"
          printf '%s' "$ANDROID_SIGNING_RECOVERY_BASE64" | base64 --decode > "$publish_dir/recovery.tar.age"
          [[ $(stat -c %s "$publish_dir/recovery.tar.age") -gt 0 && $(stat -c %s "$publish_dir/recovery.tar.age") -lt 1048576 ]]
          [[ "$(sha256sum "$publish_dir/recovery.tar.age" | cut -d' ' -f1)" == "$SIGNING_RECOVERY_SHA256" ]]
          unset ANDROID_SIGNING_RECOVERY_BASE64
          ssh_opts=(-i "$publish_dir/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$publish_dir/known_hosts" -o BatchMode=yes)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          stage="/opt/heartbeat-checker/backend/android-releases/$SOURCE_SHA-$GITHUB_RUN_ID"
          # shellcheck disable=SC2029 # Validated public release values expand locally.
          ssh "${ssh_opts[@]}" "$target" "umask 022; mkdir -p '$stage'; test ! -L '$stage'"
          ops_sha=$(sha256sum "$RUNNER_TEMP/hc-ops/hc-ops" | awk '{print $1}')
          [[ $ops_sha =~ ^[0-9a-f]{64}$ ]]
          scp "${ssh_opts[@]}" android-release/Heartbeat-Checker.apk android-release/release.json "$publish_dir/recovery.tar.age" deploy/android/publish.sh "$RUNNER_TEMP/hc-ops/hc-ops" "$target:$stage/"
          # shellcheck disable=SC2029 # Validated public release values expand locally.
          ssh "${ssh_opts[@]}" "$target" "HC_OPS_SHA256='$ops_sha' bash '$stage/publish.sh' '$SOURCE_SHA' '$SIGNING_FINGERPRINT' '$GITHUB_RUN_ID' '$SIGNING_RECOVERY_SHA256'" > android-release/publication-receipt.json
          jq -e --arg sha "$SOURCE_SHA" --arg recovery "$SIGNING_RECOVERY_SHA256" '.signingRecoverySha256 == $recovery and .status == "published" and .release.sourceSha == $sha and .anonymousListing == "403" and .anonymousBackupPrefixListing == "403" and .anonymousBackupObject == "403" and .anonymousSigningRecovery == "403"' android-release/publication-receipt.json >/dev/null
      - name: Retain verified publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-${{ inputs.source_sha }}
          path: |
            android-release/release.json
            android-release/huawei-config.json
            android-release/publication-receipt.json
          if-no-files-found: error
          retention-days: 90
