name: heartbeat-checker-local

services:
  postgres:
    # Official PostgreSQL 18.6 Debian image, pinned for the local environment.
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: heartbeat_local
      POSTGRES_USER: heartbeat_local
      # Public local-only credential. Never reuse outside this loopback setup.
      POSTGRES_PASSWORD: heartbeat_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartbeat_local -d heartbeat_local"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  mailpit:
    # Official Mailpit v1.31.3 multi-architecture image from GHCR.
    image: ghcr.io/axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"

volumes:
  postgres-data:
