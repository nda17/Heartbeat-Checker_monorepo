server {
    listen 80;
    listen [::]:80;
    server_name messengers-proxy.heartbeat-checker.ru;

    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/heartbeat-checker/relay/acme;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
