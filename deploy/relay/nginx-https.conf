server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name messengers-proxy.heartbeat-checker.ru;

    ssl_certificate /etc/letsencrypt/live/messengers-proxy.heartbeat-checker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messengers-proxy.heartbeat-checker.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Bot tokens are part of the Telegram API URL. Never log request URIs or bodies.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_redirect off;

    location ~ ^/telegram-api/bot[0-9]+:[A-Za-z0-9_-]+/(getMe|getChat|getChatMember|sendMessage|copyMessage)$ {
        allow 176.12.64.115;
        allow 127.0.0.1;
        deny all;
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }

        proxy_ssl_name api.telegram.org;
        proxy_set_header Host api.telegram.org;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        rewrite ^/telegram-api(/bot[0-9]+:[A-Za-z0-9_-]+/(getMe|getChat|getChatMember|sendMessage|copyMessage))$ $1 break;
        proxy_pass https://api.telegram.org;
    }

    location = /webhooks/support/telegram {
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }

        proxy_ssl_name api.heartbeat-checker.ru;
        proxy_set_header Host api.heartbeat-checker.ru;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_pass https://api.heartbeat-checker.ru;
    }

    location / {
        return 404;
    }
}
