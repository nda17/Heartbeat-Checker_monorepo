name: heartbeat-checker-backend

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_DB: heartbeat
      POSTGRES_USER: heartbeat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartbeat -d heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    logging: *logs

  migrate:
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE is required}
    restart: "no"
    profiles: [migration]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m
    logging: *logs

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      APP_ENV: production
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_ORIGIN: https://heartbeat-checker.ru
      AUTH_COOKIE_SECURE: "true"
      AUTH_SESSION_TTL: 720h
      TRUSTED_PROXY_CIDRS: 172.30.64.2/32
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      TURNSTILE_HOSTNAME: heartbeat-checker.ru
      TURNSTILE_LOCAL_TEST_MODE: "false"
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY is required}
      AUTH_MAIL_ENCRYPTION_KEY: ${AUTH_MAIL_ENCRYPTION_KEY:?AUTH_MAIL_ENCRYPTION_KEY is required}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-disabled}
      BILLING_MOCK_ACCOUNT_IDS: ${BILLING_MOCK_ACCOUNT_IDS:-}
      SUPPORT_ENABLED: ${SUPPORT_ENABLED:-false}
      SUPPORT_ENCRYPTION_KEY: ${SUPPORT_ENCRYPTION_KEY:-}
      TELEGRAM_INTERNAL_CHAT_ID: ${TELEGRAM_INTERNAL_CHAT_ID:-}
      TELEGRAM_SUPPORT_TOPIC_ID: ${TELEGRAM_SUPPORT_TOPIC_ID:-}
      MAX_SUPPORT_CHAT_ID: ${MAX_SUPPORT_CHAT_ID:-0}
      TELEGRAM_SUPPORT_WEBHOOK_SECRET: ${TELEGRAM_SUPPORT_WEBHOOK_SECRET:-}
      MAX_SUPPORT_WEBHOOK_SECRET: ${MAX_SUPPORT_WEBHOOK_SECRET:-}
      MESSENGER_NOTIFICATIONS_ENABLED: ${MESSENGER_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_INFORMER_WEBHOOK_SECRET: ${TELEGRAM_INFORMER_WEBHOOK_SECRET:-}
      MAX_INFORMER_WEBHOOK_SECRET: ${MAX_INFORMER_WEBHOOK_SECRET:-}
      TELEGRAM_INFORMER_BOT_USERNAME: ${TELEGRAM_INFORMER_BOT_USERNAME:-}
      MAX_INFORMER_BOT_URL: ${MAX_INFORMER_BOT_URL:-}
    networks:
      edge:
        ipv4_address: 172.30.64.3
      database:
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 320m
    logging: *logs

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PROBE_URL: http://probe:8090
      PROBE_SHARED_SECRET: ${PROBE_SHARED_SECRET:?PROBE_SHARED_SECRET is required}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY is required}
      AUTH_MAIL_ENCRYPTION_KEY: ${AUTH_MAIL_ENCRYPTION_KEY:?AUTH_MAIL_ENCRYPTION_KEY is required}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-disabled}
      BILLING_MOCK_ACCOUNT_IDS: ${BILLING_MOCK_ACCOUNT_IDS:-}
      SUPPORT_ENABLED: ${SUPPORT_ENABLED:-false}
      SUPPORT_ENCRYPTION_KEY: ${SUPPORT_ENCRYPTION_KEY:-}
      TELEGRAM_INTERNAL_CHAT_ID: ${TELEGRAM_INTERNAL_CHAT_ID:-}
      TELEGRAM_SUPPORT_TOPIC_ID: ${TELEGRAM_SUPPORT_TOPIC_ID:-}
      MAX_SUPPORT_CHAT_ID: ${MAX_SUPPORT_CHAT_ID:-0}
      TELEGRAM_BOT_SUPPORT_TOKEN: ${TELEGRAM_BOT_SUPPORT_TOKEN:-}
      MAX_BOT_SUPPORT_TOKEN: ${MAX_BOT_SUPPORT_TOKEN:-}
      SUPPORT_MAX_ROOT_CA_FILE: ${SUPPORT_MAX_ROOT_CA_FILE:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TELEGRAM_API_PROXY_IP: ${TELEGRAM_API_PROXY_IP:-}
      BILLING_REPORTS_ENABLED: ${BILLING_REPORTS_ENABLED:-false}
      TELEGRAM_BOT_INFORMER_TOKEN: ${TELEGRAM_BOT_INFORMER_TOKEN:-}
      MESSENGER_NOTIFICATIONS_ENABLED: ${MESSENGER_NOTIFICATIONS_ENABLED:-false}
      MAX_BOT_INFORMER_TOKEN: ${MAX_BOT_INFORMER_TOKEN:-}
      TELEGRAM_INFORMER_BOT_USERNAME: ${TELEGRAM_INFORMER_BOT_USERNAME:-}
      MAX_INFORMER_BOT_URL: ${MAX_INFORMER_BOT_URL:-}
      TELEGRAM_PAYMENTS_TOPIC_ID: ${TELEGRAM_PAYMENTS_TOPIC_ID:-}
      SMTP_ADDR: ${SMTP_ADDR:?SMTP_ADDR is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:?SMTP_TLS_MODE is required}
    volumes:
      - ./provider-certs:/run/provider-certs:ro
    networks:
      - database
      - probe-network
    depends_on:
      postgres:
        condition: service_healthy
      probe:
        condition: service_started
    mem_limit: 320m
    logging: *logs

  probe:
    image: ${PROBE_IMAGE:?PROBE_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    environment:
      PROBE_HTTP_ADDR: 0.0.0.0:8090
      PROBE_SHARED_SECRET: ${PROBE_SHARED_SECRET:?PROBE_SHARED_SECRET is required}
    dns:
      - 1.1.1.1
      - 9.9.9.9
    networks:
      probe-network:
        ipv4_address: 172.30.80.2
    mem_limit: 96m
    logging: *logs

  caddy:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.30.64.2
    depends_on:
      - api
    mem_limit: 128m
    logging: *logs

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.64.0/28
    enable_ipv6: false
  database:
    internal: true
    ipam:
      config:
        - subnet: 172.30.72.0/28
    enable_ipv6: false
  probe-network:
    ipam:
      config:
        - subnet: 172.30.80.0/28
    enable_ipv6: false

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
