pluginManagement {
    includeBuild('../mobile/node_modules/@react-native/gradle-plugin')
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins { id('com.facebook.react.settings') }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(
        ['node', file('../mobile/node_modules/@react-native-community/cli/build/bin.js').absolutePath, 'config'],
        file('../mobile'),
        files('../mobile/package.json', '../mobile/package-lock.json', '../mobile/react-native.config.js')
    )
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri('https://developer.huawei.com/repo/')
            content {
                includeGroup 'com.huawei.hms'
                includeGroup 'com.huawei.agconnect'
                includeGroup 'com.huawei.android.hms'
                includeGroup 'com.huawei.hmf'
            }
        }
        maven {
            url = uri('https://repo.yoomoney.ru/repository/android-libraries/')
            content { includeGroupByRegex 'ru\\.yoomoney\\.sdk\\..*' }
        }
        maven {
            url = uri('https://nexus-external.rustore.ru/repository/maven-rustore-exposed/')
            content {
                includeGroup 'ru.rustore.sdk'
                includeGroup 'ru.ok.tracer'
            }
        }
    }
}
rootProject.name = 'HeartbeatChecker'
include ':app'
includeBuild('../mobile/node_modules/@react-native/gradle-plugin')
