plugins {
    id 'com.android.application'
    id 'com.facebook.react'
}

react {
    root = file('../../mobile')
    reactNativeDir = file('../../mobile/node_modules/react-native')
    codegenDir = file('../../mobile/node_modules/@react-native/codegen')
    cliFile = file('../../mobile/node_modules/react-native/cli.js')
    entryFile = file('../../mobile/index.ts')
    debuggableVariants = ['dev']
    autolinkLibrariesWithApp()
}

def secret = { String name ->
    def path = System.getenv(name + '_FILE')
    path ? new File(path).getText('UTF-8').stripTrailing() : System.getenv(name)
}
def keystore = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = secret('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = secret('ANDROID_KEY_PASSWORD')
def signingReady = keystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def devKeystore = System.getenv('ANDROID_DEV_KEYSTORE_FILE')
def devStorePassword = secret('ANDROID_DEV_KEYSTORE_PASSWORD')
def devKeyAlias = System.getenv('ANDROID_DEV_KEY_ALIAS')
def devKeyPassword = secret('ANDROID_DEV_KEY_PASSWORD')
def devSigningReady = devKeystore && devStorePassword && devKeyAlias && devKeyPassword
def pushProjectId = (System.getenv('RUSTORE_PUSH_PROJECT_ID') ?: '').trim()
if (pushProjectId && !(pushProjectId ==~ /[A-Za-z0-9_-]{8,128}/)) {
    throw new GradleException('Invalid public RUSTORE_PUSH_PROJECT_ID')
}
def sdkClientKey = (System.getenv('YOOKASSA_SDK_CLIENT_KEY') ?: '').trim()
def sdkShopId = (System.getenv('YOOKASSA_SHOP_ID') ?: '').trim()
def sdkEnvironment = (System.getenv('YOOKASSA_SDK_ENVIRONMENT') ?: 'live').trim()
def sdkTestClientKey = (System.getenv('YOOKASSA_SDK_TEST_CLIENT_KEY') ?: '').trim()
def sdkTestShopId = (System.getenv('YOOKASSA_SDK_TEST_SHOP_ID') ?: '').trim()
if (!(sdkEnvironment in ['test', 'live'])) {
    throw new GradleException('Invalid YOOKASSA_SDK_ENVIRONMENT')
}
if ([sdkClientKey, sdkTestClientKey].any { it && !(it ==~ /[A-Za-z0-9_-]{10,512}/) }
        || [sdkShopId, sdkTestShopId].any { it && !(it ==~ /[0-9]{4,16}/) }) {
    throw new GradleException('Invalid public YooKassa SDK client configuration')
}
if (sdkClientKey && !sdkClientKey.startsWith(sdkEnvironment + '_')) {
    throw new GradleException('YooKassa SDK client key does not match its environment')
}
if (sdkTestClientKey && !sdkTestClientKey.startsWith('test_')) {
    throw new GradleException('SDK test client key must use the test environment')
}

// Public client identifiers only; sending credentials never enter the APK.
def publicOptions = [:]
['FIREBASE_APP_ID', 'FIREBASE_PROJECT_ID', 'FIREBASE_API_KEY', 'FIREBASE_SENDER_ID'].each { name ->
    def value = (System.getenv(name) ?: '').trim()
    if (value && !(value ==~ /[A-Za-z0-9_:-]{1,256}/)) throw new GradleException('Invalid public push configuration: ' + name)
    publicOptions[name] = value
}
def huaweiFlag = (System.getenv('HUAWEI_PUSH_ENABLED') ?: 'false').trim()
if (!(huaweiFlag in ['true', 'false'])) throw new GradleException('HUAWEI_PUSH_ENABLED must be true or false')
def huaweiEnabled = huaweiFlag == 'true'
def huaweiOptions = [:]
['HUAWEI_APP_ID', 'HUAWEI_PROJECT_ID', 'HUAWEI_CP_ID'].each { name ->
    def value = (System.getenv(name) ?: '').trim()
    if (value && !(value ==~ /[0-9]{1,32}/)) throw new GradleException('Invalid public push configuration: ' + name)
    huaweiOptions[name] = huaweiEnabled ? value : ''
}
if (huaweiEnabled && huaweiOptions.values().any { !it }) {
    throw new GradleException('Huawei push requires complete public HUAWEI_APP_ID, HUAWEI_PROJECT_ID and HUAWEI_CP_ID configuration.')
}

android {
    namespace 'ru.heartbeatchecker.app'
    compileSdk 37
    ndkVersion '27.1.12297006'
    buildToolsVersion '36.0.0'
    externalNativeBuild {
        cmake {
            version '3.30.5'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    defaultConfig {
        applicationId 'ru.heartbeatchecker.app'
        minSdk 29
        targetSdk 37
        versionCode 15
        versionName '2.3.3'
        manifestPlaceholders = [appLinkHost: 'heartbeat-checker.ru', huaweiEnabled: huaweiFlag,
            huaweiAppId: 'appid=' + huaweiOptions.HUAWEI_APP_ID, huaweiPublicAppId: huaweiOptions.HUAWEI_APP_ID,
            huaweiProjectId: huaweiOptions.HUAWEI_PROJECT_ID, huaweiCpId: huaweiOptions.HUAWEI_CP_ID]
        resValue 'string', 'ym_app_scheme', 'heartbeatchecker'
        buildConfigField 'String', 'YOOKASSA_SDK_CLIENT_KEY', '""'
        buildConfigField 'String', 'YOOKASSA_SHOP_ID', '""'
        buildConfigField 'String', 'YOOKASSA_SDK_ENVIRONMENT', '"live"'
        buildConfigField 'boolean', 'ISOLATED_API', 'false'
        buildConfigField 'boolean', 'DEV_CLIENT', 'false'
        buildConfigField 'String', 'API_ORIGIN', '"https://heartbeat-checker.ru"'
        buildConfigField 'String', 'CHALLENGE_ORIGIN', '"https://heartbeat-checker.ru"'
        buildConfigField 'String', 'RUSTORE_PUSH_PROJECT_ID', '"' + pushProjectId + '"'
        publicOptions.each { name, value -> buildConfigField 'String', name, '"' + value + '"' }
        buildConfigField 'boolean', 'HUAWEI_PUSH_ENABLED', huaweiFlag
        huaweiOptions.each { name, value -> buildConfigField 'String', name, '"' + value + '"' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(keystore)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
        if (devSigningReady) {
            dev {
                storeFile file(devKeystore)
                storePassword = devStorePassword
                keyAlias = devKeyAlias
                keyPassword = devKeyPassword
            }
        }
    }
    buildTypes {
        dev {
            initWith debug
            signingConfig = devSigningReady ? signingConfigs.dev : null
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            manifestPlaceholders.appLinkHost = 'android-dev.heartbeat-checker.invalid'
            matchingFallbacks = ['debug', 'release']
            debuggable true
            resValue 'string', 'ym_app_scheme', 'heartbeatcheckerdev'
            buildConfigField 'boolean', 'DEV_CLIENT', 'true'
            buildConfigField 'boolean', 'HUAWEI_PUSH_ENABLED', 'false'
            huaweiOptions.each { name, value -> buildConfigField 'String', name, '""' }
            manifestPlaceholders += [huaweiEnabled: 'false', huaweiAppId: 'appid=', huaweiPublicAppId: '', huaweiProjectId: '', huaweiCpId: '']
            buildConfigField 'String', 'RUSTORE_PUSH_PROJECT_ID', '""'
            buildConfigField 'String', 'YOOKASSA_SDK_CLIENT_KEY', '""'
            buildConfigField 'String', 'YOOKASSA_SHOP_ID', '""'
            ['FIREBASE_APP_ID', 'FIREBASE_PROJECT_ID', 'FIREBASE_API_KEY', 'FIREBASE_SENDER_ID'].each { name ->
                buildConfigField 'String', name, '""'
            }
        }
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled false
            buildConfigField 'String', 'YOOKASSA_SDK_CLIENT_KEY', '"' + sdkClientKey + '"'
            buildConfigField 'String', 'YOOKASSA_SHOP_ID', '"' + sdkShopId + '"'
            buildConfigField 'String', 'YOOKASSA_SDK_ENVIRONMENT', '"' + sdkEnvironment + '"'
        }
        ci {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
        }
        sdkTest {
            initWith release
            applicationIdSuffix '.sdktest'
            versionNameSuffix '-sdktest'
            manifestPlaceholders.appLinkHost = 'sdk-test.heartbeat-checker.invalid'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
            resValue 'string', 'ym_app_scheme', 'heartbeatcheckersdktest'
            buildConfigField 'String', 'YOOKASSA_SDK_CLIENT_KEY', '"' + sdkTestClientKey + '"'
            buildConfigField 'String', 'YOOKASSA_SHOP_ID', '"' + sdkTestShopId + '"'
            buildConfigField 'String', 'YOOKASSA_SDK_ENVIRONMENT', '"test"'
            buildConfigField 'boolean', 'ISOLATED_API', 'true'
            buildConfigField 'boolean', 'HUAWEI_PUSH_ENABLED', 'false'
            huaweiOptions.each { name, value -> buildConfigField 'String', name, '""' }
            manifestPlaceholders += [huaweiEnabled: 'false', huaweiAppId: 'appid=', huaweiPublicAppId: '', huaweiProjectId: '', huaweiCpId: '']
            buildConfigField 'String', 'API_ORIGIN', '"http://127.0.0.1:18080"'
            buildConfigField 'String', 'CHALLENGE_ORIGIN', '"http://127.0.0.1:13119"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    testBuildType 'ci'
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register('requireReleaseSigning') {
    doLast {
        if (!signingReady || !file(keystore).isFile()) {
            throw new GradleException('Release signing requires ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (passwords may use _FILE).')
        }
        if (publicOptions.values().any { !it }) {
            throw new GradleException('Release requires complete public Firebase client configuration.')
        }
        if (!pushProjectId) {
            throw new GradleException('Release requires the public RUSTORE_PUSH_PROJECT_ID for the registered package and signing certificate.')
        }
        if (sdkEnvironment == 'test' && (!sdkClientKey || !sdkShopId)) {
            throw new GradleException('Test SDK environment requires its public client key and shop ID in the signed release.')
        }
    }
}
tasks.register('requireDevSigning') {
    doLast {
        if (!devSigningReady || !file(devKeystore).isFile()) {
            throw new GradleException('Dev APK requires its separate ANDROID_DEV_KEYSTORE_FILE, ANDROID_DEV_KEYSTORE_PASSWORD, ANDROID_DEV_KEY_ALIAS and ANDROID_DEV_KEY_PASSWORD.')
        }
    }
}
tasks.register('requireSdkTestConfig') {
    doLast {
        if (!sdkTestClientKey || !sdkTestShopId) throw new GradleException('SDK test APK requires YooKassa public test client key and shop ID')
    }
}
tasks.configureEach {
    if (name.startsWith('configureCMake')) {
        // A cold native build needs generated React headers before CMake configures autolinked libraries.
        dependsOn ':react-native-safe-area-context:generateCodegenArtifactsFromSchema',
                ':react-native-webview:generateCodegenArtifactsFromSchema'
    }
    if (name in ['packageRelease', 'packageReleaseBundle', 'signReleaseBundle', 'assembleRelease', 'bundleRelease']) {
        dependsOn tasks.named('requireReleaseSigning')
    }
    if (name in ['packageDev', 'assembleDev']) dependsOn tasks.named('requireDevSigning')
    if (name in ['packageSdkTest', 'assembleSdkTest']) dependsOn tasks.named('requireSdkTestConfig')
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'com.facebook.react:hermes-android'
    implementation 'ru.yoomoney.sdk.kassa.payments:yookassa-android-sdk:8.6.0'
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'ru.rustore.sdk:pushclient:7.5.0'
    implementation 'com.google.firebase:firebase-messaging:26.0.0'
    implementation 'com.google.android.gms:play-services-base:18.9.0'
    implementation 'com.huawei.hms:push:6.13.0.301'
    implementation 'androidx.work:work-runtime:2.12.0'
    constraints {
        implementation('androidx.work:work-runtime-ktx:2.12.0') {
            because 'Align the SDK transitive KTX artifact with the Java WorkManager runtime'
        }
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
