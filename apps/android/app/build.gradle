plugins {
    id 'com.android.application'
    id 'com.facebook.react'
}

react {
    root = file('../../mobile')
    reactNativeDir = file('../../mobile/node_modules/react-native')
    codegenDir = file('../../mobile/node_modules/@react-native/codegen')
    cliFile = file('../../mobile/node_modules/react-native/cli.js')
    entryFile = file('../../mobile/index.ts')
    debuggableVariants = []
    autolinkLibrariesWithApp()
}

def secret = { String name ->
    def path = System.getenv(name + '_FILE')
    path ? new File(path).getText('UTF-8').stripTrailing() : System.getenv(name)
}
def keystore = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = secret('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = secret('ANDROID_KEY_PASSWORD')
def signingReady = keystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def pushProjectId = (System.getenv('RUSTORE_PUSH_PROJECT_ID') ?: '').trim()
if (pushProjectId && !(pushProjectId ==~ /[A-Za-z0-9_-]{8,128}/)) {
    throw new GradleException('Invalid public RUSTORE_PUSH_PROJECT_ID')
}
def sdkClientKey = (System.getenv('YOOKASSA_SDK_CLIENT_KEY') ?: '').trim()
def sdkShopId = (System.getenv('YOOKASSA_SHOP_ID') ?: '').trim()
def sdkTestClientKey = (System.getenv('YOOKASSA_SDK_TEST_CLIENT_KEY') ?: '').trim()
def sdkTestShopId = (System.getenv('YOOKASSA_SDK_TEST_SHOP_ID') ?: '').trim()
if ([sdkClientKey, sdkTestClientKey].any { it && !(it ==~ /[A-Za-z0-9_-]{10,512}/) }
        || [sdkShopId, sdkTestShopId].any { it && !(it ==~ /[0-9]{4,16}/) }) {
    throw new GradleException('Invalid public YooKassa SDK client configuration')
}

// Public client identifiers only; sending credentials never enter the APK.
def publicOptions = [:]
['FIREBASE_APP_ID', 'FIREBASE_PROJECT_ID', 'FIREBASE_API_KEY', 'FIREBASE_SENDER_ID'].each { name ->
    def value = (System.getenv(name) ?: '').trim()
    if (value && !(value ==~ /[A-Za-z0-9_:-]{1,256}/)) throw new GradleException('Invalid public push configuration: ' + name)
    publicOptions[name] = value
}

android {
    namespace 'ru.heartbeatchecker.app'
    compileSdk 37
    ndkVersion '27.1.12297006'
    buildToolsVersion '36.0.0'
    externalNativeBuild {
        cmake {
            version '3.30.5'
        }
    }

    defaultConfig {
        applicationId 'ru.heartbeatchecker.app'
        minSdk 29
        targetSdk 37
        versionCode 7
        versionName '2.0.0'
        manifestPlaceholders = [appLinkHost: 'heartbeat-checker.ru']
        resValue 'string', 'ym_app_scheme', 'heartbeatchecker'
        buildConfigField 'String', 'YOOKASSA_SDK_CLIENT_KEY', '""'
        buildConfigField 'String', 'YOOKASSA_SHOP_ID', '""'
        buildConfigField 'String', 'BILLING_ENVIRONMENT', '"live"'
        buildConfigField 'String', 'API_ORIGIN', '"https://heartbeat-checker.ru"'
        buildConfigField 'String', 'CHALLENGE_ORIGIN', '"https://heartbeat-checker.ru"'
        buildConfigField 'String', 'RUSTORE_PUSH_PROJECT_ID', '"' + pushProjectId + '"'
        publicOptions.each { name, value -> buildConfigField 'String', name, '"' + value + '"' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(keystore)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled false
            buildConfigField 'String', 'YOOKASSA_SDK_CLIENT_KEY', '"' + sdkClientKey + '"'
            buildConfigField 'String', 'YOOKASSA_SHOP_ID', '"' + sdkShopId + '"'
            buildConfigField 'String', 'BILLING_ENVIRONMENT', '"live"'
        }
        ci {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
        }
        sdkTest {
            initWith release
            applicationIdSuffix '.sdktest'
            versionNameSuffix '-sdktest'
            manifestPlaceholders.appLinkHost = 'sdk-test.heartbeat-checker.invalid'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
            resValue 'string', 'ym_app_scheme', 'heartbeatcheckersdktest'
            buildConfigField 'String', 'YOOKASSA_SDK_CLIENT_KEY', '"' + sdkTestClientKey + '"'
            buildConfigField 'String', 'YOOKASSA_SHOP_ID', '"' + sdkTestShopId + '"'
            buildConfigField 'String', 'BILLING_ENVIRONMENT', '"test"'
            buildConfigField 'String', 'API_ORIGIN', '"http://127.0.0.1:18080"'
            buildConfigField 'String', 'CHALLENGE_ORIGIN', '"http://127.0.0.1:13119"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    testBuildType 'ci'
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register('requireReleaseSigning') {
    doLast {
        if (!signingReady || !file(keystore).isFile()) {
            throw new GradleException('Release signing requires ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (passwords may use _FILE).')
        }
        if (publicOptions.values().any { !it }) {
            throw new GradleException('Release requires complete public Firebase client configuration.')
        }
        if (!pushProjectId) {
            throw new GradleException('Release requires the public RUSTORE_PUSH_PROJECT_ID for the registered package and signing certificate.')
        }
    }
}
tasks.register('requireSdkTestConfig') {
    doLast {
        if (!sdkTestClientKey || !sdkTestShopId) throw new GradleException('SDK test APK requires YooKassa public test client key and shop ID')
    }
}
tasks.configureEach {
    if (name in ['packageRelease', 'packageReleaseBundle', 'signReleaseBundle', 'assembleRelease', 'bundleRelease']) {
        dependsOn tasks.named('requireReleaseSigning')
    }
    if (name in ['packageSdkTest', 'assembleSdkTest']) dependsOn tasks.named('requireSdkTestConfig')
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'com.facebook.react:hermes-android'
    implementation 'ru.yoomoney.sdk.kassa.payments:yookassa-android-sdk:8.6.0'
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'ru.rustore.sdk:pushclient:7.5.0'
    implementation 'com.google.firebase:firebase-messaging:26.0.0'
    implementation 'com.google.android.gms:play-services-base:18.9.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    constraints {
        implementation('androidx.work:work-runtime-ktx:2.12.0') {
            because 'Align the SDK transitive KTX artifact with the Java WorkManager runtime'
        }
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
