plugins {
    id 'com.android.application'
}

def secret = { String name ->
    def path = System.getenv(name + '_FILE')
    path ? new File(path).getText('UTF-8').stripTrailing() : System.getenv(name)
}
def keystore = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = secret('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = secret('ANDROID_KEY_PASSWORD')
def signingReady = keystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def pushProjectId = (System.getenv('RUSTORE_PUSH_PROJECT_ID') ?: '').trim()
if (pushProjectId && !(pushProjectId ==~ /[A-Za-z0-9_-]{8,128}/)) {
    throw new GradleException('Invalid public RUSTORE_PUSH_PROJECT_ID')
}

// Public client identifiers only; sending credentials never enter the APK.
def publicOptions = [:]
['FIREBASE_APP_ID', 'FIREBASE_PROJECT_ID', 'FIREBASE_API_KEY', 'FIREBASE_SENDER_ID'].each { name ->
    def value = (System.getenv(name) ?: '').trim()
    if (value && !(value ==~ /[A-Za-z0-9_:-]{1,256}/)) throw new GradleException('Invalid public push configuration: ' + name)
    publicOptions[name] = value
}

android {
    namespace 'ru.heartbeatchecker.app'
    compileSdk 37
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'ru.heartbeatchecker.app'
        minSdk 29
        targetSdk 37
        versionCode 6
        versionName '1.2.0'
        buildConfigField 'String', 'RUSTORE_PUSH_PROJECT_ID', '"' + pushProjectId + '"'
        publicOptions.each { name, value -> buildConfigField 'String', name, '"' + value + '"' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(keystore)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register('requireReleaseSigning') {
    doLast {
        if (!signingReady || !file(keystore).isFile()) {
            throw new GradleException('Release signing requires ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (passwords may use _FILE).')
        }
        if (publicOptions.values().any { !it }) {
            throw new GradleException('Release requires complete public Firebase client configuration.')
        }
        if (!pushProjectId) {
            throw new GradleException('Release requires the public RUSTORE_PUSH_PROJECT_ID for the registered package and signing certificate.')
        }
    }
}
tasks.configureEach {
    if (name in ['packageRelease', 'packageReleaseBundle', 'signReleaseBundle', 'assembleRelease', 'bundleRelease']) {
        dependsOn tasks.named('requireReleaseSigning')
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'ru.rustore.sdk:pushclient:7.5.0'
    implementation 'com.google.firebase:firebase-messaging:26.0.0'
    implementation 'com.google.android.gms:play-services-base:18.9.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    constraints {
        implementation('androidx.work:work-runtime-ktx:2.12.0') {
            because 'Align the SDK transitive KTX artifact with the Java WorkManager runtime'
        }
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
